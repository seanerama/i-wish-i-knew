name: CI
# I Wish I Knew — Verity hygiene gate (stack-agnostic).
# Secret-scan + a structure check, no faked pass. Project gates (lint/test/…)
# live in ONE committed place — .verity/gates.json — executed by the `gates`
# job below AND by the Verity local gate runner (stage 82, ADR-0029 §4), so CI
# can never drift from the gates that were green locally. Until the Architect
# defines that file (when the stack and walking skeleton land — the
# progressive gate, framework-spec §3), the gates job FAILS with instructions:
# a repo with no committed gates must never read green (ADR-0028).
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
  pull-requests: read # gitleaks lists PR commits via the API on pull_request
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  # Verity single-source gates (stage 82, ADR-0029 §4): this job executes the
  # SAME committed `.verity/gates.json` the local gate runner executes —
  # ordered, named commands judged by EXIT CODE only (ADR-0028: never through
  # a pipe, never parsed output). No definition ⇒ the runner FAILS LOUDLY with
  # instructions — a repo whose gates are missing must never read green (the
  # issue-#203 defect class, closed by construction). Define your gates in
  # .verity/gates.json as the stack lands; the runner script is committed at
  # .verity/run-gates.cjs by the scaffold.
  gates:
    runs-on: ubuntu-latest
    # Stack per ADR-0001: Node 22 + PostgreSQL. The spine test (docs/walking-skeleton.md)
    # needs a real database, so CI provides the same thing `docker compose up -d db`
    # provides locally — the gate commands themselves are identical in both places.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: iwik
          POSTGRES_PASSWORD: iwik
          POSTGRES_DB: iwik_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U iwik"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://iwik:iwik@localhost:5432/iwik_test
      IWIK_KEK: ci-only-not-a-secret-0000000000000000
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - name: Run the committed gate definition (.verity/gates.json)
        run: node .verity/run-gates.cjs
  structure:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Required files present
        run: |
          for f in README.md LICENSE; do
            test -f "$f" || { echo "missing required file: $f"; exit 1; }
          done
          echo "structure ok"
  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  # Stage 4 (ADR-0004): prove the multi-arch build that release.yml will push
  # succeeds BEFORE a tag is cut. Same Dockerfile, same platforms, no push.
  # The job always runs (so it can be a required check) but the emulated
  # arm64 build only happens when a PR touches the image/deploy surface or on
  # a push to main; otherwise it reports a visible SKIP and exits 0.
  release-dry-run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Detect image/deploy changes
        id: changes
        uses: dorny/paths-filter@v4
        with:
          filters: |
            image:
              - 'Dockerfile'
              - '.dockerignore'
              - 'docker-compose.yml'
              - 'deploy/**'
              - '.github/workflows/release.yml'
              - '.github/workflows/ci.yml'
              - 'package-lock.json'
              - 'package.json'
              - 'packages/*/package.json'
              - '.npmrc'
      - name: Skip notice
        if: github.event_name == 'pull_request' && steps.changes.outputs.image != 'true'
        run: echo "SKIP release-dry-run - no change to Dockerfile, .dockerignore, docker-compose.yml, deploy/, release.yml, ci.yml, package-lock.json, package.json, packages/*/package.json, or .npmrc"
      - uses: docker/setup-qemu-action@v4
        if: github.event_name != 'pull_request' || steps.changes.outputs.image == 'true'
        with:
          platforms: arm64
      - uses: docker/setup-buildx-action@v4
        if: github.event_name != 'pull_request' || steps.changes.outputs.image == 'true'
      - name: docker buildx build --platform linux/amd64,linux/arm64 (no push)
        if: github.event_name != 'pull_request' || steps.changes.outputs.image == 'true'
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: false
          tags: i-wish-i-knew:dryrun
          provenance: false
          sbom: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
      # Stage 12 (issue #18): scan what release.yml would push, BEFORE a tag
      # is cut, so a vulnerable dependency fails the PR rather than the
      # release. A multi-arch build cannot be loaded into the local daemon,
      # so the linux/amd64 half is rebuilt from the same cache and loaded,
      # then scanned exactly as release.yml scans the pushed image.
      - name: docker buildx build --platform linux/amd64 --load (for the scan)
        if: github.event_name != 'pull_request' || steps.changes.outputs.image == 'true'
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          load: true
          tags: i-wish-i-knew:scan
          provenance: false
          sbom: false
          cache-from: type=gha
      - name: Trivy scan (HIGH/CRITICAL, fixable only)
        if: github.event_name != 'pull_request' || steps.changes.outputs.image == 'true'
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: image
          image-ref: i-wish-i-knew:scan
          scanners: vuln
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'
          format: table
