# Local development and the "clean machine" check (stage 2 acceptance):
#
#   IWIK_KEK=$(openssl rand -hex 32) docker compose up --build
#   curl -s localhost:3000/readyz     # {"ok":true}
#
# Only the database is needed for `npm test`:
#
#   docker compose up -d db           # or IWIK_DB_PORT=55432 if 5432 is taken
#   DATABASE_URL=postgres://iwik:iwik@localhost:5432/iwik IWIK_KEK=dev-only npm test
#
# The image runs with NODE_ENV=production, so IWIK_KEK must be a real 32-byte
# key (64 hex chars) and intake is OFF unless IWIK_FEATURE_INTAKE=on. The
# seed identity (IWIK_SEED_*) is optional; leave it unset for an empty service.
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: iwik
      POSTGRES_PASSWORD: iwik
      POSTGRES_DB: iwik
    ports:
      - '${IWIK_DB_PORT:-5432}:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U iwik -d iwik']
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - iwik-db:/var/lib/postgresql/data

  migrate:
    build: .
    image: i-wish-i-knew:local
    command: ['node', 'packages/service/dist/migrate.js']
    environment:
      DATABASE_URL: postgres://iwik:iwik@db:5432/iwik
    depends_on:
      db:
        condition: service_healthy

  app:
    build: .
    image: i-wish-i-knew:local
    ports:
      - '${PORT:-3000}:3000'
    environment:
      DATABASE_URL: postgres://iwik:iwik@db:5432/iwik
      IWIK_KEK: ${IWIK_KEK:?set IWIK_KEK to 64 hex characters (openssl rand -hex 32)}
      IWIK_FEATURE_INTAKE: ${IWIK_FEATURE_INTAKE:-off}
      IWIK_SEED_ORG: ${IWIK_SEED_ORG:-}
      IWIK_SEED_NODE_TOKEN: ${IWIK_SEED_NODE_TOKEN:-}
      IWIK_SEED_NODE_PUBKEY: ${IWIK_SEED_NODE_PUBKEY:-}
      IWIK_SEED_NODE_ID: ${IWIK_SEED_NODE_ID:-}
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://127.0.0.1:3000/readyz']
      interval: 10s
      timeout: 5s
      retries: 6
    depends_on:
      migrate:
        condition: service_completed_successfully

volumes:
  iwik-db: {}
